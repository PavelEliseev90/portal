{# Список чатов только по автомобилям (slug содержит car). Использовать на странице директора ГК. #}
<div class="hidemobile" style="position: fixed; bottom: 0; right: 0; padding: 20px; z-index: 1030;">
    <button type="button" class="btn bg-dark text-white" id="chat_cars_open" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRightCars" aria-controls="offcanvasRightCars"><span class="icon-mbri-chat"></span> Чаты по автомобилям</button>
</div>

<div class="offcanvas offcanvas-end" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasRightCars" aria-labelledby="offcanvasRightCarsLabel">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasRightCarsLabel">Чаты по автомобилям</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Закрыть"></button>
    </div>
    <div class="offcanvas-body">
        <div class="container" style="padding-bottom: 2rem;">
            <div class="row align-items-center align-self-center message-list" id="message-list-cars" name="message-list-cars"></div>
        </div>
    </div>
</div>

<script>
(function() {
    var chatListCarsUrl = '{{ params.chat_list_cars_url|default:"/cars/js/get_chats_list_cars/" }}';
    function refresh_data_cars() {
        var el = document.getElementById('message-list-cars');
        if (!el) return;
        el.innerHTML = '';
        fetch(chatListCarsUrl, { credentials: 'same-origin' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (!Array.isArray(data)) return;
                for (var s = 0; s < data.length; s++) {
                    var obj = data[s];
                    var unit = obj.rlk_unit != null ? obj.rlk_unit : (obj.rlk_unit_dc || '');
                    var mark = obj.mark != null ? obj.mark : '—';
                    var model = obj.model != null ? obj.model : '';
                    var modification = obj.modification != null ? obj.modification : '';
                    var vin = obj.vin || '';
                    var content = (obj.content || '').substring(0, 150);
                    var formattedDate = '';
                    if (obj.max_date) {
                        var dateList = new Date(obj.max_date);
                        formattedDate = dateList.toLocaleDateString() + ' ' + dateList.toLocaleTimeString();
                    }
                    var href = (obj.name && obj.name.indexOf('/') === 0) ? obj.name : ('/cars/' + (obj.slug ? obj.slug.replace(/^car_/, '') : '') + '/');
                    var html = '<a href="' + href + '" class="text-dark text-decoration-none">';
                    html += '<div class="item-chat-message col-12"><div class="item-chat-body">';
                    html += '<div class="item-content-chat"><label class="item-subtitle">' + unit + '<br>' + mark + ' ' + model + ' ' + modification + '<br>' + vin + '</label><hr></div>';
                    html += '<p class="item-time-chat">' + content + ' <br> ' + formattedDate + '</p>';
                    html += '</div></div></a>';
                    el.innerHTML = el.innerHTML + html;
                }
            })
            .catch(function() { el.innerHTML = '<p class="text-muted">Не удалось загрузить чаты</p>'; });
    }
    document.addEventListener('DOMContentLoaded', function() {
        refresh_data_cars();
        var btn = document.getElementById('chat_cars_open');
        if (btn) btn.addEventListener('click', function() { refresh_data_cars(); });
    });
})();
</script>
