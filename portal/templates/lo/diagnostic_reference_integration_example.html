<!--

  Этот файл содержит примеры кода для добавления иконок подсказок

<!-- ============================================ -->
<!-- ПРИМЕР 1: Раздел "Двигатель" -->
<!-- ============================================ -->
<!-- Найдите в lo_v3.html заголовок раздела "Двигатель" и замените на: -->

<div class="card">
  <div class="card-body">
    <h6>
      <span class="icon-mbri-credit-card"></span> Двигатель
      <button 
        type="button" 
        class="btn btn-sm btn-link p-0 ms-2 diagnostic-reference-icon" 
        data-bs-toggle="modal" 
        data-bs-target="#diagnosticReferenceModal"
        data-category="engine"
        title="Открыть справочник диагностики"
        style="color: #002a5a; text-decoration: none;"
      >
        <i class="bi bi-info-circle"></i>
      </button>
    </h6>
    <hr style="width: 75%;">
    
    <!-- Существующие radio buttons и комментарий -->
    <!-- ... -->
    
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="comment_engine" name="comment_engine" 
             value="{{params.estimation.page_test_drive.comment_engine}}" 
             placeholder="" autocomplete="off">
      <label for="floatingInput">Комментарий</label>
    </div>
  </div>
</div>

<!-- ============================================ -->
<!-- ПОДКЛЮЧЕНИЕ МОДАЛЬНОГО ОКНА -->
<!-- ============================================ -->
<!-- В конце файла lo_v3.html (перед {% endblock %}) добавьте: -->

{% include 'lo/diagnostic_reference_modal.html' %}

<!-- ============================================ -->
<!-- ИНИЦИАЛИЗАЦИЯ ВЫБРАННЫХ ЭЛЕМЕНТОВ -->
<!-- ============================================ -->
<!-- Добавьте в конец страницы (после подключения модального окна): -->

<script>
$(document).ready(function() {
  // Загружаем уже выбранные элементы из params
  {% if params.selected_references %}
    {% for category_code, item_ids in params.selected_references.items %}
      $('#selected_reference_items_{{ category_code }}').val('{{ item_ids|join:"," }}');
    {% endfor %}
  {% endif %}
});
</script>
