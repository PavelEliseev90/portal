/* search-select-wrapper */
.search-select-wrapper {
  position: relative;
  margin-bottom: 0.75rem;
}

.search-select-wrapper label {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  padding: 0.375rem 0.75rem;
  pointer-events: none;
  border: 1px solid transparent;
  transform-origin: 0 0;
  transition: opacity 0.1s ease-in-out, transform 0.1s ease-in-out;
  color: #8ea1ba;
  font-size: 0.85rem;
  z-index: 1;
}

.search-select {
  border-radius: 0.95rem;
  border: 1px solid rgba(0, 42, 90, 0.15);
  box-shadow: none;
  transition: border 0.2s ease, box-shadow 0.2s ease;
  padding: 1.625rem 0.75rem 0.625rem;
  height: calc(3.5rem + 2px);
  min-height: calc(3.5rem + 2px);
}

.search-select:focus {
  border-color: #002a5a;
  box-shadow: 0 0 0 0.2rem rgba(0, 42, 90, 0.1);
  outline: 0;
}

.search-select:focus ~ label,
.search-select:not([value=""]) ~ label,
.search-select.has-value ~ label {
  opacity: 0.65;
  transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
  color: #002a5a;
}

/* Стили для Select2 (если используется Select2) */
.select2-container--default .select2-selection--single {
  border-radius: 0.95rem;
  border: 1px solid rgba(0, 42, 90, 0.15);
  box-shadow: none;
  transition: border 0.2s ease, box-shadow 0.2s ease;
  height: calc(3.5rem + 2px);
  min-height: calc(3.5rem + 2px);
  padding: 1.2rem 0.75rem 0.625rem;
}

.select2-container--default .select2-selection--single:focus {
  box-shadow: 0 0 0 0.2rem rgba(0, 42, 90, 0.1);
  outline: 0;
}

.select2-container--default .select2-selection--single .select2-selection__rendered {
  padding-left: 0;
  padding-right: 0;
}

.select2-container--default .select2-selection--single .select2-selection__arrow {
  height: calc(3.5rem + 2px);
  right: 0.75rem;
}

/* Обертка для label при использовании Select2 */
.search-select-wrapper.select2-wrapper label {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  padding: 0.6rem 0.75rem;
  pointer-events: none;
  transform-origin: 0 0;
  transition: opacity 0.1s ease-in-out, transform 0.1s ease-in-out;
  color: #8ea1ba;
  font-size: 0.85rem;
  z-index: 1;
}

.select2-container--default.select2-container--focus ~ label,
.select2-container--default.select2-container--open ~ label,
.search-select-wrapper.select2-wrapper.has-value label {
  opacity: 0.65;
  transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
  color: #002a5a;
}
