{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Моя покупка{% endblock %} — КорсГрупп</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --ink: #0b1f3a;
      --muted: #5b6b82;
      --line: rgba(11, 31, 58, 0.1);
      --brand: #0057a8;
      --brand-soft: #e8f2fc;
      --accent: #00a878;
      --accent-soft: #e6f7f1;
      --warn: #d97706;
      --warn-soft: #fff7e8;
      --radius: 18px;
      --shadow: 0 14px 40px rgba(11, 31, 58, 0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .cj-wrap {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: linear-gradient(180deg, #edf4fb 0%, var(--bg) 220px, var(--bg) 100%);
    }
    .cj-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.1rem 0.5rem;
      gap: 0.75rem;
    }
    .cj-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .cj-brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), #1f8fff);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      font-weight: 800;
    }
    .cj-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }
    .cj-main { padding: 0 1rem 5.5rem; }
    .cj-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      margin-bottom: 0.85rem;
    }
    .cj-section-title {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .cj-muted { color: var(--muted); font-size: 0.82rem; }
    .cj-money { font-variant-numeric: tabular-nums; font-weight: 800; }
    .cj-bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 0.45rem 0.25rem calc(0.45rem + env(safe-area-inset-bottom));
      z-index: 20;
    }
    .cj-nav-item {
      text-align: center;
      padding: 0.45rem 0.2rem;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
    }
    .cj-nav-item.active { color: var(--brand); }
    .cj-nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      margin: 0 auto 0.25rem;
      opacity: 0.35;
    }
    .cj-nav-item.active .cj-nav-dot { opacity: 1; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <div class="cj-wrap">
    {% block body %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
