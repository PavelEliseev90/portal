{% comment %}Заголовок столбца с сортировкой{% endcomment %}
<th class="{% if col.num %}num{% endif %}">
  {% if col.sortable %}
  <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none fw-semibold asp-sort-btn" data-sort-key="{{ col.sort_key }}">
    {{ col.label }}
    {% if params.filters.order_by == col.sort_key %}↑{% elif params.filters.order_by == "-"|add:col.sort_key %}↓{% endif %}
  </button>
  {% else %}
  {{ col.label }}
  {% endif %}
</th>
