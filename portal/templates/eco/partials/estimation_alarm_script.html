{% if params.can_manage_alarm %}
<script>
(function () {
  function csrfToken() {
    var m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }

  function post(url, done) {
    fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'X-CSRFToken': csrfToken(),
        'X-Requested-With': 'XMLHttpRequest',
      },
    }).then(function (r) { return r.json(); }).then(done).catch(function () {
      alert('Не удалось выполнить действие с будильником');
    });
  }

  function syncUi(alarm) {
    if (!alarm) return;
    var snooze = alarm.alarm_snooze_minutes || 15;

    // Блок на вкладке «Согласование»
    var block = document.getElementById('estimation_alarm_block');
    if (block) {
      var status = document.getElementById('estimation_alarm_status_text');
      var setBtn = document.getElementById('estimation_alarm_set_btn');
      var dismissBtn = document.getElementById('estimation_alarm_dismiss_btn');
      if (alarm.has_alarm) {
        block.classList.remove('alert-light', 'border', 'alert-secondary');
        block.classList.add(alarm.alarm_ringing ? 'alert-danger' : 'alert-secondary');
        if (status) {
          var who = alarm.alarm_set_by_name ? ', поставил ' + alarm.alarm_set_by_name : '';
          status.textContent = alarm.alarm_ringing
            ? '— сработал' + who
            : '— ' + (alarm.alarm_label || '') + who + (alarm.alarm_due_at ? ' (' + alarm.alarm_due_at + ')' : '');
        }
        if (setBtn) {
          setBtn.textContent = '+' + snooze + ' мин';
          setBtn.classList.remove('btn-outline-primary');
          setBtn.classList.add('btn-outline-secondary');
        }
        if (!dismissBtn) {
          var wrap = block.querySelector('.d-flex.gap-1');
          if (wrap) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-sm btn-outline-danger';
            btn.id = 'estimation_alarm_dismiss_btn';
            btn.textContent = 'Снять';
            btn.addEventListener('click', function () { dismissFrom(block); });
            wrap.appendChild(btn);
          }
        }
      } else {
        block.classList.remove('alert-danger', 'alert-secondary');
        block.classList.add('alert-light', 'border');
        if (status) {
          status.textContent = '— напомнить через ' + snooze + ' мин всей ЕЦО';
        }
        if (setBtn) {
          setBtn.textContent = 'Будильник';
          setBtn.classList.add('btn-outline-primary');
          setBtn.classList.remove('btn-outline-secondary');
        }
        if (dismissBtn) dismissBtn.remove();
      }
    }

    // Кнопки в шапке чата
    var chatCtrl = document.getElementById('estimation_alarm_chat_controls');
    if (chatCtrl) {
      var setChat = document.getElementById('estimation_alarm_set_btn_chat');
      var dismissChat = document.getElementById('estimation_alarm_dismiss_btn_chat');
      if (setChat) {
        setChat.innerHTML = '<span class="bi bi-alarm"></span> ' + (alarm.has_alarm ? ('+' + snooze) : 'Будильник');
        setChat.classList.toggle('btn-outline-primary', !alarm.has_alarm);
        setChat.classList.toggle('btn-outline-secondary', !!alarm.has_alarm);
        setChat.title = alarm.has_alarm
          ? ('Переставить +' + snooze + ' мин')
          : ('Поставить будильник на ' + snooze + ' мин');
      }
      if (alarm.has_alarm && !dismissChat) {
        var d = document.createElement('button');
        d.type = 'button';
        d.className = 'btn btn-sm btn-outline-danger';
        d.id = 'estimation_alarm_dismiss_btn_chat';
        d.title = 'Снять будильник';
        d.textContent = 'Снять';
        d.addEventListener('click', function () { dismissFrom(chatCtrl); });
        chatCtrl.appendChild(d);
      } else if (!alarm.has_alarm && dismissChat) {
        dismissChat.remove();
      }
    }

    // Бейдж в заголовке чата
    var title = document.getElementById('offcanvasRightLabel');
    if (title) {
      var old = title.querySelector('.eco-alarm-title-badge');
      if (old) old.remove();
      if (alarm.has_alarm) {
        var badge = document.createElement('span');
        badge.className = 'badge eco-alarm-title-badge ms-1 ' + (alarm.alarm_ringing ? 'bg-danger' : 'bg-secondary');
        badge.title = alarm.alarm_set_by_name ? ('поставил ' + alarm.alarm_set_by_name) : '';
        badge.innerHTML = '<span class="bi bi-alarm"></span> ' +
          (alarm.alarm_ringing ? 'будильник' : (alarm.alarm_label || ''));
        title.appendChild(badge);
      }
    }
  }

  function setFrom(el) {
    var url = el.getAttribute('data-set-url');
    if (!url) return;
    post(url, function (data) {
      if (!data || !data.ok) {
        alert((data && data.error === 'alarm_not_allowed')
          ? 'Будильник недоступен для этой оценки (принята/в архиве)'
          : 'Не удалось поставить будильник');
        return;
      }
      syncUi(data.alarm);
    });
  }

  function dismissFrom(el) {
    var url = el.getAttribute('data-dismiss-url');
    if (!url) return;
    post(url, function (data) {
      if (!data || !data.ok) {
        alert('Не удалось снять будильник');
        return;
      }
      syncUi(data.alarm);
    });
  }

  var block = document.getElementById('estimation_alarm_block');
  if (block) {
    var setBtn = document.getElementById('estimation_alarm_set_btn');
    if (setBtn) setBtn.addEventListener('click', function () { setFrom(block); });
    var dismissBtn = document.getElementById('estimation_alarm_dismiss_btn');
    if (dismissBtn) dismissBtn.addEventListener('click', function () { dismissFrom(block); });
  }

  var chatCtrl = document.getElementById('estimation_alarm_chat_controls');
  if (chatCtrl) {
    var setChat = document.getElementById('estimation_alarm_set_btn_chat');
    if (setChat) setChat.addEventListener('click', function () { setFrom(chatCtrl); });
    var dismissChat = document.getElementById('estimation_alarm_dismiss_btn_chat');
    if (dismissChat) dismissChat.addEventListener('click', function () { dismissFrom(chatCtrl); });
  }
})();
</script>
{% endif %}
