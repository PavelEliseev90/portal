{% extends 'base_web.html' %}
{% load custom_template_tags %}

{% block title %} - оценка {{params.rlk}} {% endblock %}

{% block title_navbar %} - оценка {{params.rlk}} {% endblock %}

{% block content %}
 

<div class="fixed-top hidemobile my_pages_title" >
  
  <div class="row g-1">
    
    <div class="col text-center">
      <div class="row g-1 text-white"  style="background-color: #6c757d; margin-top: -1.5rem; padding: 0; border-radius: 0 0 0.5rem 0.5rem; " >
        <br><label class="fs-4"> &nbsp;<span class="icon-mbri-info"></span>Данные автомобиля</label><br>       
      </div>   
    </div>

  </div>

</div>


<div class="fixed-top hidesite my_pages_title">
  
  <div class="row g-1 w-100">
    
    <div class="col text-center">
      <div class="row-1 dw-block text-white" style="background-color: #6c757d; margin-top: -1.5rem; padding-top: 1rem; padding-left: 0.2rem; padding-right: 0.2rem; border-radius: 0 0 0.5rem 0.5rem; ">        
        <label class="fs-4"> &nbsp;<span class="icon-mbri-info"></span>Данные автомобиля</label>       <br>
      </div>    
    </div>

  </div>

</div>

<br>

<div class="container-sm" style="max-width: 575px;">
  <div class="card bg-gradient bg-secondary bg-opacity-10">
    <div class="card-body">

      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">VIN - номер автомобиля</label>
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
      </div>

      <label class="text-secondary" for="floatingInput" style="padding-left: 0.2rem;">Марка</label><br>
      <div class="checkselect ">
              
        <div class="sticky-top bg-white">
          <input class="form-control form-control-sm" type="text" id="mark_name" value="" placeholder="">
          <br>
          <hr>
        </div>
        
        {% for unit in params.select_units %}
        
          <label class="" id="label_search {{unit.name}}"><input type="checkbox" name="mark_name[]" value="{{mark_name.pk}}" id="mark_filtr_{{mark_name.pk}}" {% if unit.pk|join:"" in params.filtr.filter_unit %} checked {% endif %} > {{unit.name}}</label>
  
        {% endfor %}
      
        <script>
          $('#mark_name').on('input', function() {
              var search = $(this).val();
              if (search.length === 0){
                $('[id*="label_search"]').removeClass('d-none');
              }
              else {
                $('[id*="label_search"]').addClass('d-none');
                var search_lower = search.toLowerCase();
                var labels = $('[id*="label_search"]');
                for (let i = 0; i < labels.length; i++) {
                  label = labels[i];
                  var id_name = label.id.toLowerCase();
                  if (id_name.indexOf(search_lower) >= 0){
                    console.log(label.id);
                    $('[id*="' + label.id + '"]').removeClass('d-none');                        
                  };
                };
              };                  
          });              
        </script>

      </div> 

    </div>
  </div>
  
</div>

{% endblock %}
