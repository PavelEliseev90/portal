{% extends 'base_web.html' %}
{% load custom_template_tags %}

{% block title %} - оценка {{params.rlk}} {% endblock %}

{% block title_navbar %} - оценка {{params.rlk}} {% endblock %}

{% block content %}
 

  <div class=" fixed-top hidemobile my_pages_title">
    
    <div class="row g-1">
      
      <div class="col">
        <div class="row g-1 text-white"  style="background-color: #6c757d; margin-top: -1.5rem; padding: 0; border-radius: 0 0 0.5rem 0.5rem; " >
          <label class="fs-3"> <span class="icon-mbri-calendar"></span>&nbsp;Год выпуска </label>
        </div>   
      </div>
      
      <div class="col-12">
        <input class="form-control form-control-sm" style="margin-top: 0.2rem;" type="text" id="filter_site" name="filter_site" value="{{params.year_filter}}" onkeyup="myFunction_site()" placeholder="Поиск...">
      </div>

    </div>

  </div>


<div class="fixed-top hidesite my_pages_title">
  <div class="hstack gap-1">
    <div class="row  g-1">
    
      <div class="col-12">
        <div class="row-1 dw-block text-white" style="background-color: #6c757d; margin-top: -1.5rem; padding-top: 1rem; padding-left: 0.2rem; padding-right: 0.2rem; border-radius: 0 0 0.5rem 0.5rem; ">
          <label class="fs-4"> &nbsp;<span class="icon-mbri-calendar"></span>&nbsp;Год выпуска&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>    
        </div>    
      </div>
  
      <div class="col-12">
        <div class="row-1 text-white" >
          <input class="form-control form-control-sm" style="margin-top: 0.2rem;" type="text" id="filter_mobile" name="filter_mobile" value="{{params.year_filter}}" onkeyup="myFunction()" placeholder="Поиск...">
        </div>
      </div>
  
    </div>
  </div>
  

</div>

    
  <ul id="myUL" class="my_pages_info" >
    

    {% for year in params.years %}
    
      
        <li style="margin-bottom: 0.2rem; padding: 0.3rem;" class="btn text-start container-fluid btn-outline-secondary">
          <a href="{{year}}/" class="text-dark" >
            <div class="row g-1">
              <div class="col-1 align-self-center">
                <span class="icon-mbri-play"></span>
              </div>
              <div class="col-11">
                {{year}}
              </div>
            </div>
          </a>
        </li>
      

    {% endfor %}

  </ul>


  <script>
    
    $(document).ready(function() {
        myFunction();
        myFunction_site()
      });
    

    function myFunction() {
      // Объявлять переменные
      var input, filter, ul, li, a, i, txtValue;
      input = document.getElementById('filter_mobile');
      filter = input.value.toUpperCase();
      ul = document.getElementById("myUL");
      li = ul.getElementsByTagName('li');
    
      // Выполните цикл по всем элементам списка и скройте те, которые не соответствуют запросу поиска
      for (i = 0; i < li.length; i++) {
        a = li[i].getElementsByTagName("a")[0];
        txtValue = a.textContent || a.innerText;
        if (txtValue.toUpperCase().indexOf(filter) > -1) {
          li[i].style.display = "";
        } else {
          li[i].style.display = "none";
        }
      }
    }
    function myFunction_site() {
      // Объявлять переменные
      var input, filter, ul, li, a, i, txtValue;
      input = document.getElementById('filter_site');
      filter = input.value.toUpperCase();
      ul = document.getElementById("myUL");
      li = ul.getElementsByTagName('li');
    
      // Выполните цикл по всем элементам списка и скройте те, которые не соответствуют запросу поиска
      for (i = 0; i < li.length; i++) {
        a = li[i].getElementsByTagName("a")[0];
        txtValue = a.textContent || a.innerText;
        if (txtValue.toUpperCase().indexOf(filter) > -1) {
          li[i].style.display = "";
        } else {
          li[i].style.display = "none";
        }
      }
    }
  
  </script>

      
  


{% endblock %}
