<script type="text/javascript">
    
  function clearError(groups){
      errorLabel =document.querySelector('#e' + groups);
      errorLabel.innerHTML = ""
  }

  function validate_form(){
      
      valid = true
      var error = document.querySelector('#e');
      error.innerHTML = ""
      
      var manual_title = document.querySelector('#manual_title');   
      if (manual_title.value.length == 0){
          valid = false
          error.innerHTML = error.innerHTML + '<br>' + 'Не указана тема инструкции'
      } 
      
      if (!valid){
        error.innerHTML = '<b>' +  error.innerHTML + '</b>'
      }

      return valid

  }

</script>

<form name="form" method="post" onsubmit="return validate_form();">
  
    {% csrf_token %}
    
    <input type="hidden" name="uin" id="myFile" value="{{params.manual.id}}">
    
    <div class="row g-2">
    
      <div class="row g-1">
        
        <div class="col">
          <div class="input-group">
            <span class="input-group-text">Тема</span>
            <input type="text" aria-label="First name" id = "manual_title" name = "manual_title" class="form-control" value="{{params.manual.title}}">
          </div>
        </div>

        <div class="col-auto">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="True" id="activated" name="activated" {% if params.manual.activated %} checked {% endif %}>
            <label class="form-check-label" for="activated">
              Активна
            </label>
          </div>
        </div>

      </div>

     
      
      <div class="django-ckeditor-widget" data-field-id="id_text" style="display: inline-block;">
        <textarea cols="50" id="id_text" name="text" rows="50" required data-processed="0" data-config="{&quot;skin&quot;: &quot;moono-lisa&quot;, &quot;toolbar_Basic&quot;: [[&quot;Source&quot;, &quot;-&quot;, &quot;Bold&quot;, &quot;Italic&quot;]], &quot;toolbar_Full&quot;: [[&quot;Styles&quot;, &quot;Format&quot;, &quot;Bold&quot;, &quot;Italic&quot;, &quot;Underline&quot;, &quot;Strike&quot;, &quot;SpellChecker&quot;, &quot;Undo&quot;, &quot;Redo&quot;], [&quot;Link&quot;, &quot;Unlink&quot;, &quot;Anchor&quot;], [&quot;Image&quot;, &quot;Flash&quot;, &quot;Table&quot;, &quot;HorizontalRule&quot;], [&quot;TextColor&quot;, &quot;BGColor&quot;], [&quot;Smiley&quot;, &quot;SpecialChar&quot;], [&quot;Source&quot;]], &quot;toolbar&quot;: &quot;None&quot;, &quot;height&quot;: 291, &quot;width&quot;: 835, &quot;filebrowserWindowWidth&quot;: 940, &quot;filebrowserWindowHeight&quot;: 725, &quot;filebrowserUploadUrl&quot;: &quot;/ckeditor/upload/&quot;, &quot;filebrowserBrowseUrl&quot;: &quot;/ckeditor/browse/&quot;, &quot;language&quot;: &quot;ru&quot;}" data-external-plugin-resources="[]" data-id="id_text" data-type="ckeditortype">
          {{params.manual.text}}
        </textarea>
        <script type="text/javascript" src="/static/ckeditor/ckeditor/ckeditor.js"></script>
        <script type="text/javascript">
            CKEDITOR.replace('editor1');
            AjexFileManager.init({
              returnTo: 'ckeditor',
              editor: ckeditor1
            });
        </script>
      </div>

      <div class="input-group">
        <span class="input-group-text">Теги</span>
        <div class="col-sm" style="padding-left: 5px;">
          <div class="row">
            {% for tag in params.tags %}
              <div class="col-auto">
                <input name="tag_id_{{tag.id}}" type="checkbox" class="btn-check" id="{{tag.id}}" autocomplete="off">
                <label class="btn btn-outline-dark" for="{{tag.id}}">{{tag.name}}</label>
              </div>
            {% endfor %}
          </div>
        </div>
    
      </div>
      
      <div class="row g-1">
        
        <div class="col-sm-auto">
          <div class="input-group">
            <span class="input-group-text">Автор</span>
            <input type="text" disabled aria-label="First name" class="form-control" value="{{params.user}}">
          </div>
        </div>
        
      </div>

      <label name="e" id="e" style="color: brown; text-align: center;"></label>
      
      <button type="submit" class="btn btn-dark">Сохранить</button>

</form>		         
        

<script>
  window.onload = function(){
    setInterval(function(){
        $('#cke_id_text').css('width', '100%');
    }, 500);
  };
</script>

{% endblock %}
