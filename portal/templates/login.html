 {% extends 'base_web.html' %}


{% block title %} Kors - group - вход {% endblock %}


{% block content %}
<form method="POST" id="contactForm" autocomplete="off">

  
    <body>
	    <div class="container-fluid ">    
            <div class="row g-1">
    
                <div class="col-sm"></div>
        
                <div class="col-sm-5 ">
               
                      {% csrf_token %}
                    
                        <br>
                    
                        <h1 class="h3 mb-3 fw-normal">Вход</h1>
                        
                        <div class="hidemobile">
                          <br>
                        </div>
                        <div class="hidesite">
                          <hr style="width: 75%;">
                        </div>
                        
                        <div class="form-floating mb-3">
                          <input type="text" class="form-control" id="floatingInput" name="login" placeholder="" value="{{params.login}}" autocomplete="new-login">
                          <label for="floatingInput">Логин</label>
                        </div>
                        
                        <div class="form-floating mb-3">
                          <input type="password" class="form-control" id="floatingInput" name="password" placeholder="" autocomplete="new-password">
                          <label for="floatingInput">Пароль</label>
                        </div>
                      
                        {% if params.error %}
                          <br>
                          <label style="color: red" for="floatingInput">{{params.error}}</label> 
                          <br>

                          
                        {% endif %}
  
                        <div class="hidemobile">
                          <br>
                        </div>
                        <div class="hidesite">
                          <hr style="width: 75%;">
                        </div>
                        
                        <script src='https://www.google.com/recaptcha/api.js'></script>
                        
                        
                        <div class="form-group g-recaptcha" data-sitekey="6LeqkkUrAAAAAPHyHXENqhEg8av-trt9dnEOU4nJ">
                          
                        </div>
                        
                        
                        <br>
                        
                        <button class="btn btn-block btn-dark " style="width: 10rem;" type="submit"> <span class="icon-mbri-play"> </span> Войти</button>

                </div>
            
                <div class="col-sm"></div>
        
             </div>

        </div>  

     </body>      	
		         
</form>  

<script>


  </script>

{% endblock %}
