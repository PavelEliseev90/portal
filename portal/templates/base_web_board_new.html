
<!DOCTYPE HTML>

<html>
  
    <head>
    
        <title>{% block title %} Kors - group {% endblock %}</title>
      
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta http-equiv="refresh" {% block refresh %} content="60" {% endblock %}/>
    
        <link rel="shortcut icon" type="image/x-icon" href="/static/images/fav-icon.ico" />
        <link href="/static/css/style.css" rel='stylesheet' type='text/css' />
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">
        <script src="/static/js/bootstrap.bundle.min.js"></script>
    
        {% block head %} 
        
        
        <script language="JavaScript">
    
            function zero_first_format(value)
            {
                if (value < 10)
                {
                    value='0'+value;
                }
                return value;
            }
        
            function fulltime () {
              
              var days = [
                'Воскресенье',
                'Понедельник',
                'Вторник',
                'Среда',
                'Четверг',
                'Пятница',
                'Суббота'
              ];
              var d = new Date();
              var n = d.getDay();
              
              document.getElementById('days').innerHTML   = days[n];
        
              var time = new Date();
        
              var hours   = zero_first_format(time.getHours());
              var minutes = zero_first_format(time.getMinutes());
              var seconds = zero_first_format(time.getSeconds());
              
              var day     = zero_first_format(time.getDate());
              var month   = zero_first_format(time.getMonth()+1);
              var year    = time.getFullYear()
        
              var clockW  = hours + ":" + minutes; 
              var dateW   = day + "." + month + "." + year;
              
              document.getElementById('clock').innerHTML  = clockW;
              
              document.getElementById('year').innerHTML   = dateW;
              
              setTimeout('fulltime()', 500);
        
          }
        
          </script>
          
          {% endblock %}

    </head>
  
    
    {% block content %} 
    
    {% endblock %}

  
       
    
    <script language="JavaScript">
        function a(page)
        {
           var url = new URL(document.location.href);
           url.searchParams.set('page', page)
           document.location.href  = url.href;
        }
        
    </script>
    
</html>
