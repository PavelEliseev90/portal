{% extends 'base_web.html' %}
{% load static %}

{% block title %} - {{ title }} {% endblock %}
{% block title_navbar %} - {{ title }} {% endblock %}

{% block content %}
<div class="portal-page">
  <div class="portal-header">
    <h2>{{ title }}</h2>
  </div>

  <div class="portal-panel">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <div class="form-floating">
            {{ form.name }}
            <label>Наименование</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            {{ form.code }}
            <label>Код</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            {{ form.uom }}
            <label>Ед. изм.</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-check d-flex align-items-center h-100">
            {{ form.is_active }}
            <label class="form-check-label ms-2" for="{{ form.is_active.id_for_label }}">Активен</label>
          </div>
        </div>
        <div class="col-md-12">
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-outline-success">
              <span class="icon-mbri-save"></span> Сохранить
            </button>
            <a href="{% url 'car_preparation:materials_list' %}" class="btn btn-outline-secondary">
              <span class="icon-mbri-left"></span> Отмена
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
