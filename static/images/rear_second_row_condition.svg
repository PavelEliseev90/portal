<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Rear Second Row Condition Diagram</title>
  <desc id="desc">Second row seat condition marking template with numbered zones.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5f6"/>
      <stop offset="100%" stop-color="#e5e8ec"/>
    </linearGradient>
    <linearGradient id="seatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9bec5"/>
      <stop offset="100%" stop-color="#8f959d"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#949aa3"/>
      <stop offset="100%" stop-color="#717781"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5b6068" flood-opacity="0.32"/>
    </filter>
    <style>
      .outline { stroke: #3f4349; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .inner { stroke: #4f5560; stroke-width: 2; fill: none; }
      .zone { fill: #c8ccd2; }
      .meta { font-family: Arial, Helvetica, sans-serif; fill: #202328; }
      .head { font-size: 44px; font-weight: 700; letter-spacing: 1px; }
      .sub { font-size: 28px; font-weight: 600; }
      .legend { font-size: 25px; font-weight: 600; }
      .legend-item { font-size: 22px; }
      .numCircle { fill: #f9fafb; stroke: #3f4349; stroke-width: 2.5; }
      .numText { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #1f2328; text-anchor: middle; dominant-baseline: middle; }
      .belt { fill: #7d838c; stroke: #41464d; stroke-width: 2; }
      .beltRed { fill: #ca4545; stroke: #822a2a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="780" fill="url(#bgGrad)"/>
  <text x="700" y="70" class="meta head" text-anchor="middle">SECOND ROW CONDITION ASSESSMENT</text>
  <text x="700" y="112" class="meta sub" text-anchor="middle">Mark damage, wear, stains, tears and defects by zone number</text>

  <!-- side trims -->
  <path d="M150 220 C120 310,120 480,160 580 L240 580 C210 500,208 310,246 220 Z" fill="url(#panelGrad)" class="outline" opacity="0.95"/>
  <path d="M1250 220 C1280 310,1280 480,1240 580 L1160 580 C1190 500,1192 310,1154 220 Z" fill="url(#panelGrad)" class="outline" opacity="0.95"/>

  <!-- left headrest -->
  <rect x="280" y="160" rx="34" ry="34" width="190" height="130" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>
  <rect x="335" y="286" width="18" height="35" rx="8" fill="#717783" class="outline"/>
  <rect x="398" y="286" width="18" height="35" rx="8" fill="#717783" class="outline"/>

  <!-- center headrest -->
  <rect x="592" y="178" rx="30" ry="30" width="216" height="112" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>
  <rect x="661" y="286" width="16" height="30" rx="7" fill="#717783" class="outline"/>
  <rect x="724" y="286" width="16" height="30" rx="7" fill="#717783" class="outline"/>

  <!-- right headrest -->
  <rect x="930" y="160" rx="34" ry="34" width="190" height="130" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>
  <rect x="985" y="286" width="18" height="35" rx="8" fill="#717783" class="outline"/>
  <rect x="1048" y="286" width="18" height="35" rx="8" fill="#717783" class="outline"/>

  <!-- backrests -->
  <path d="M238 312 C238 275,278 252,322 252 L428 252 C480 252,525 284,540 337 L560 490 C570 550,535 610,468 625 L323 625 C264 620,226 577,225 521 Z" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>
  <path d="M546 332 C552 276,602 250,652 250 L748 250 C802 250,852 275,859 332 L866 496 C870 570,827 626,756 626 L648 626 C575 625,536 570,540 496 Z" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>
  <path d="M860 337 C875 284,920 252,972 252 L1078 252 C1122 252,1162 275,1162 312 L1175 521 C1174 577,1136 620,1077 625 L932 625 C865 610,830 550,840 490 Z" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>

  <!-- cushion base -->
  <path d="M223 521 C260 498,332 490,430 492 C518 494,585 507,620 532 L620 666 C525 698,351 712,226 674 Z" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>
  <path d="M620 532 C676 507,724 502,780 512 C844 523,891 547,921 580 L921 676 C841 702,712 710,620 666 Z" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>
  <path d="M921 580 C968 547,1015 523,1079 512 C1135 502,1183 507,1239 532 L1239 666 C1147 710,1018 702,938 676 Z" fill="url(#seatGrad)" class="outline" filter="url(#softShadow)"/>

  <!-- segmented zones (backrests) -->
  <path d="M292 335 C315 313,345 302,380 302 C418 302,450 314,471 338" class="inner"/>
  <path d="M280 406 C315 378,352 366,387 366 C425 366,462 381,495 411" class="inner"/>
  <path d="M273 489 C315 456,359 442,400 442 C441 442,484 457,522 489" class="inner"/>

  <path d="M594 338 C623 314,654 302,700 302 C746 302,777 314,806 338" class="inner"/>
  <path d="M586 415 C624 384,660 374,700 374 C740 374,776 384,814 415" class="inner"/>
  <path d="M583 498 C626 462,664 452,700 452 C736 452,774 462,817 498" class="inner"/>

  <path d="M928 338 C949 314,981 302,1019 302 C1054 302,1084 313,1107 335" class="inner"/>
  <path d="M905 411 C938 381,975 366,1013 366 C1048 366,1085 378,1120 406" class="inner"/>
  <path d="M878 489 C916 457,959 442,1000 442 C1041 442,1085 456,1127 489" class="inner"/>

  <!-- segmented zones (cushions) -->
  <path d="M258 555 C344 535,474 535,574 558" class="inner"/>
  <path d="M260 603 C346 585,472 585,574 605" class="inner"/>
  <path d="M646 565 C720 548,824 552,891 578" class="inner"/>
  <path d="M651 617 C726 602,818 607,891 629" class="inner"/>
  <path d="M956 578 C1023 552,1127 548,1201 565" class="inner"/>
  <path d="M956 629 C1029 607,1121 602,1196 617" class="inner"/>

  <!-- belts and buckles -->
  <path d="M430 270 L300 490 L324 501 L454 284 Z" class="belt"/>
  <path d="M972 270 L1102 490 L1078 501 L948 284 Z" class="belt"/>
  <rect x="600" y="575" width="22" height="44" rx="5" class="beltRed"/>
  <rect x="912" y="589" width="22" height="44" rx="5" class="beltRed"/>

  <!-- legends -->
  <text x="80" y="250" class="meta legend">Rear Left Seat</text>
  <text x="80" y="286" class="meta legend-item">1. Headrest</text>
  <text x="80" y="316" class="meta legend-item">2. Backrest L</text>
  <text x="80" y="346" class="meta legend-item">3. Backrest C</text>
  <text x="80" y="376" class="meta legend-item">4. Backrest R</text>
  <text x="80" y="406" class="meta legend-item">5. Cushion L</text>
  <text x="80" y="436" class="meta legend-item">6. Cushion C</text>
  <text x="80" y="466" class="meta legend-item">7. Cushion R</text>

  <text x="1180" y="250" class="meta legend">Rear Right Seat</text>
  <text x="1180" y="286" class="meta legend-item">8. Headrest</text>
  <text x="1180" y="316" class="meta legend-item">9. Backrest L</text>
  <text x="1180" y="346" class="meta legend-item">10. Backrest C</text>
  <text x="1180" y="376" class="meta legend-item">11. Backrest R</text>
  <text x="1180" y="406" class="meta legend-item">12. Cushion L</text>
  <text x="1180" y="436" class="meta legend-item">13. Cushion C</text>
  <text x="1180" y="466" class="meta legend-item">14. Cushion R</text>

  <text x="640" y="730" class="meta legend-item">15. Center Headrest</text>
  <text x="840" y="730" class="meta legend-item">16. Center Backrest</text>
  <text x="1040" y="730" class="meta legend-item">17. Center Cushion</text>

  <!-- numbered markers -->
  <g>
    <circle class="numCircle" cx="375" cy="225" r="19"/><text class="numText" x="375" y="225">1</text>
    <circle class="numCircle" cx="315" cy="360" r="19"/><text class="numText" x="315" y="360">2</text>
    <circle class="numCircle" cx="390" cy="405" r="19"/><text class="numText" x="390" y="405">3</text>
    <circle class="numCircle" cx="476" cy="475" r="19"/><text class="numText" x="476" y="475">4</text>
    <circle class="numCircle" cx="298" cy="561" r="19"/><text class="numText" x="298" y="561">5</text>
    <circle class="numCircle" cx="402" cy="607" r="19"/><text class="numText" x="402" y="607">6</text>
    <circle class="numCircle" cx="540" cy="632" r="19"/><text class="numText" x="540" y="632">7</text>

    <circle class="numCircle" cx="1025" cy="225" r="19"/><text class="numText" x="1025" y="225">8</text>
    <circle class="numCircle" cx="1110" cy="360" r="19"/><text class="numText" x="1110" y="360">9</text>
    <circle class="numCircle" cx="1010" cy="405" r="19"/><text class="numText" x="1010" y="405">10</text>
    <circle class="numCircle" cx="930" cy="475" r="19"/><text class="numText" x="930" y="475">11</text>
    <circle class="numCircle" cx="1100" cy="561" r="19"/><text class="numText" x="1100" y="561">12</text>
    <circle class="numCircle" cx="994" cy="607" r="19"/><text class="numText" x="994" y="607">13</text>
    <circle class="numCircle" cx="860" cy="632" r="19"/><text class="numText" x="860" y="632">14</text>

    <circle class="numCircle" cx="700" cy="233" r="19"/><text class="numText" x="700" y="233">15</text>
    <circle class="numCircle" cx="700" cy="430" r="19"/><text class="numText" x="700" y="430">16</text>
    <circle class="numCircle" cx="770" cy="602" r="19"/><text class="numText" x="770" y="602">17</text>
  </g>
</svg>
